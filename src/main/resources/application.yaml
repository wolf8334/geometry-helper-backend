# =============================================================================
# 应用公共配置
# -----------------------------------------------------------------------------
# 本项目同时运行两个 AI 引擎：
#   1. app.ai.vision：视觉理解引擎，供 POST /api/solve 使用；
#   2. app.ai.chat  ：普通文本对话引擎，供 POST /api/chat 使用。
#
# 每个引擎独立选择 provider 和 model，因此可以同时使用不同供应商：
#   例如视觉用 Ofox、对话用硅基流动，或者反过来。
#
# 敏感信息（API Key、数据库密码）请通过环境变量注入，不要提交到代码仓库。
# =============================================================================
spring:
  application:
    name: geometry-helper-backend

  ai:
    # 关闭 Spring AI 的单模型自动配置。
    # 本项目在 AiConfig 中手动创建两个 ChatModel / ChatClient，避免多个
    # ChatModel Bean 导致自动配置歧义。
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none

    # 关闭自动 ChatClient.Builder，两个 ChatClient 也由 AiConfig 手动创建。
    chat:
      client:
        enabled: false

  # 图片上传限制。超过限制时由全局异常处理器转换为友好的 JSON 错误。
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

  # PostgreSQL 18 数据源配置。
  # Hikari 通过 schema 和 connection-init-sql 双保险保证每个连接都使用
  # geometry 作为 search_path。
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/geometry
    username: postgres
    password: ${PG_PWD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GeometryHikariPool
      schema: geometry
      connection-init-sql: SET search_path TO geometry
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

server:
  port: 9876

# =============================================================================
# 日志配置
# -----------------------------------------------------------------------------
# 具体格式和滚动策略在 logback-spring.xml 中定义。
# 这里只控制文件目录和日志级别，便于通过环境变量快速调整。
# =============================================================================
logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: INFO
    com.xhr.geometryhelperbackend: INFO
    org.springframework.ai: WARN

# =============================================================================
# AI 业务配置
# =============================================================================
app:
  ai:
    # -------------------------------------------------------------------------
    # 供应商连接池：只配置 endpoint 和 API Key。
    # 新增供应商时在这里加一项，然后在 vision/chat 的 provider 中引用即可。
    # -------------------------------------------------------------------------
    providers:
      siliconflow:
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY:}
      ofox:
        base-url: https://api.ofox.ai/v1
        api-key: ${OFOX_API_KEY:}
      ds:
        base-url: https://api.deepseek.com/v1
        api-key: ${DS_KEY:}

    # -------------------------------------------------------------------------
    # 视觉理解引擎（VL / Vision）
    # 必须选择支持图片输入的模型。
    # -------------------------------------------------------------------------
    vision:
      provider: ${VISION_PROVIDER:siliconflow}
      model: ${VISION_MODEL:Qwen/Qwen3-VL-32B-Instruct}
      temperature: ${VISION_TEMPERATURE:0.7}
      max-tokens: ${VISION_MAX_TOKENS:4096}
      timeout: 120s
      max-retries: 2
      system-prompt: |
        你是一名专业、严谨的图片内容描述助手。
        请始终使用简体中文回答，客观描述图片中能够确认的信息；
        看不清或无法判断的内容不要编造。
      user-prompt: |
        请仔细观察这张图片，并用简体中文详细描述图片内容，包括：
        1. 图片的主体对象和场景;
        2. 图中可见的文字、公式或标注（如有）;
        3. 与几何图形相关的形状、线段、角度、坐标等信息（如有）;
        4. 不要输出与题目无关的内容，如图上二维码的内容等等。
        5. 只输出描述内容，不要输出多余的前后缀。

    # -------------------------------------------------------------------------
    # 普通对话引擎（纯文本）
    # 可以使用成本更低的纯文本模型，与视觉引擎完全独立。
    # -------------------------------------------------------------------------
    chat:
      provider: ${CHAT_PROVIDER:siliconflow}
      model: ${CHAT_MODEL}
      temperature: ${CHAT_TEMPERATURE:0.1}
      max-tokens: ${CHAT_MAX_TOKENS:4096}
      timeout: 60s
      max-retries: 2
      # 最多携带最近多少条历史消息，防止多轮对话 token 无限增长。
      max-history-messages: 20
      system-prompt: |
        你是一名专业、友好的中文 AI 助手。
        请使用简体中文回答，表达清晰、准确；
        如果用户的问题涉及你不确定的信息，请明确说明，不要编造。
