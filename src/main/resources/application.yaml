# =============================================================================
# 应用公共配置
# -----------------------------------------------------------------------------
# 本项目同时运行三个 AI 引擎：
#   1. app.ai.vision：视觉理解引擎，负责图片识别和题目分析；
#   2. app.ai.solve ：正式解题引擎，接收确认后的题目复述、已生成的前文和原图；
#   3. app.ai.chat  ：普通文本对话引擎，供 POST /api/chat 使用。
#
# 每个引擎独立选择 provider 和 model，因此可以同时使用不同供应商：
#   例如视觉用 DeepSeek 分析，正式解题用 Ofox 的 Anthropic 模型，对话用其他文本模型。
#
# 敏感信息（API Key、数据库密码）请通过环境变量注入，不要提交到代码仓库。
# =============================================================================
spring:
  application:
    name: geometry-helper-backend

  ai:
    # 关闭 Spring AI 的单模型自动配置。
    # 本项目在 AiConfig 中手动创建三个 ChatModel / ChatClient，避免多个
    # ChatModel Bean 导致自动配置歧义。
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none

    # 关闭自动 ChatClient.Builder，三个 ChatClient 也由 AiConfig 手动创建。
    chat:
      client:
        enabled: false

  # 图片上传限制。超过限制时由全局异常处理器转换为友好的 JSON 错误。
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

  # PostgreSQL 18 数据源配置。
  # Hikari 通过 schema 和 connection-init-sql 双保险保证每个连接都使用
  # geometry 作为 search_path。
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema=geometry
    username: postgres
    password: ${PG_PWD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GeometryHikariPool
      schema: geometry
      connection-init-sql: SET search_path TO geometry
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}
      # 连接池会主动回收空闲连接，避免数据库或代理先断开后 Hikari 才发现。
      # keepalive-time 必须小于 max-lifetime；默认每分钟保活、10 分钟强制回收。
      # 如果数据库/代理的 idle timeout 更短，请把这两个值等比例调小。
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME:60000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:600000}

server:
  port: 9876

# =============================================================================
# 日志配置
# -----------------------------------------------------------------------------
# 具体格式和滚动策略在 logback-spring.xml 中定义。
# 这里只控制文件目录和日志级别，便于通过环境变量快速调整。
# =============================================================================
logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: INFO
    com.xhr.geometryhelperbackend: INFO
    org.springframework.ai: WARN

# =============================================================================
# AI 业务配置
# =============================================================================
app:
  ai:
    # -------------------------------------------------------------------------
    # 供应商连接池：只配置 endpoint 和 API Key。
    # 新增供应商时在这里加一项，然后在 vision/solve/chat 的 provider 中引用即可。
    # -------------------------------------------------------------------------
    providers:
      siliconflow:
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY:}
      ofox:
        base-url: https://api.ofox.ai/v1
        # 模型 ID 以 anthropic 开头时，AiConfig 会自动改用 Anthropic Messages 协议。
        anthropic-base-url: https://api.ofox.ai/anthropic
        api-key: ${OFOX_API_KEY:}
      ds:
        base-url: https://api.deepseek.com/v1
        api-key: ${DS_KEY:}

    # -------------------------------------------------------------------------
    # 视觉理解引擎（VL / Vision）
    # 必须选择支持图片输入的模型。
    # 当 provider=ofox 且 model 以 anthropic 开头时，同样会自动切换到
    # Anthropic Messages 协议，并改用上面的 ofox.anthropic-base-url。
    # -------------------------------------------------------------------------
    vision:
      provider: ${VISION_PROVIDER:ofox}
      model: ${VISION_MODEL:anthropic/claude-haiku-5.5}
      temperature: ${VISION_TEMPERATURE:0.2}
      max-tokens: ${VISION_MAX_TOKENS:65536}
      timeout: 600s
      max-retries: 2
      system-prompt: |
        你是一名专业、严谨的图片内容描述助手。
        请始终使用简体中文回答，客观描述图片中能够确认的信息；
        看不清或无法判断的内容不要编造。
      user-prompt: |
        请仔细观察这张图片，并用简体中文详细描述图片内容，包括：
        1. 图片的主体对象和场景;
        2. 图中可见的文字、公式或标注（如有；公式使用 LaTeX，行内用 $...$，独立用 $$...$$）;
        3. 与几何图形相关的形状、线段、角度、坐标等信息（如有）;
        4. 不要输出与题目无关的内容，如图上二维码的内容等等。
        5. 只输出描述内容，不要输出多余的前后缀。

    # -------------------------------------------------------------------------
    # 正式解题引擎
    # 默认同时接收用户确认后的题目复述、已生成的前文和原图；如果解题模型只
    # 支持文本，可设置 include-image: false。
    # 当 provider=ofox 且 model 以 anthropic 开头时，AiConfig 会自动切换到
    # Anthropic Messages 协议，并改用上面的 ofox.anthropic-base-url。
    # -------------------------------------------------------------------------
    solve:
      provider: ${SOLVE_PROVIDER:ofox}
      model: ${SOLVE_MODEL:anthropic/claude-haiku-5.5}
      temperature: ${SOLVE_TEMPERATURE:0.2}
      max-tokens: ${SOLVE_MAX_TOKENS:65536}
      timeout: 300s
      max-retries: 2
      include-image: ${SOLVE_INCLUDE_IMAGE:true}
      # 解题引擎允许使用的知识范围。当前先限制为中国国内初二及以前各学科知识（不限于数学）；
      # 后续细化时直接改这里，或通过环境变量覆盖。
      knowledge-scope: ${SOLVE_KNOWLEDGE_SCOPE:中国国内初二及以前各学科知识（不限于数学）}
      system-prompt: |
        你是一名严谨、耐心的老师，知识水平相当于中国国内初二教师：初二及以前各学科知识都可以使用，不限于数学。
        请使用简体中文，按照用户确认后的题目理解逐步推导；
        每一步写清楚依据、公式和计算，不跳步，
        不使用“易知”“易得”“显然”等省略性表述；
        最后单独给出结论或答案。
        所有公式必须使用 LaTeX：行内公式用 $...$，独立公式用 $$...$$，
        使用 KaTeX 支持的标准命令（如 \frac、\sqrt、\angle、\triangle、\boxed），
        不要用 Unicode 上下标或纯文本替代公式。

    # -------------------------------------------------------------------------
    # 普通对话引擎（纯文本）
    # 可以使用成本更低的纯文本模型，与视觉引擎完全独立。
    # 当 provider=ofox 且 model 以 anthropic 开头时，同样会自动切换到
    # Anthropic Messages 协议，并改用上面的 ofox.anthropic-base-url。
    # -------------------------------------------------------------------------
    chat:
      provider: ${CHAT_PROVIDER:ofox}
      model: ${CHAT_MODEL:anthropic/claude-haiku-5.5}
      temperature: ${CHAT_TEMPERATURE:0.1}
      max-tokens: ${CHAT_MAX_TOKENS:65536}
      timeout: 120s
      max-retries: 2
      # 最多携带最近多少条历史消息，防止多轮对话 token 无限增长。
      max-history-messages: 20
      system-prompt: |
        你是一名专业、友好的中文 AI 助手。
        请使用简体中文回答，表达清晰、准确；
        如果用户的问题涉及你不确定的信息，请明确说明，不要编造。

  followup:
    # 每道题最多允许的追问次数；默认 3 次，设为 0 可关闭追问。
    max-questions: ${FOLLOWUP_MAX_QUESTIONS:3}
